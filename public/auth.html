<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Authorizing...</title>

    <script src="/auth.js" defer></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0d1117;
        color: #e6edf3;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 208, 132, 0.2);
        border-top-color: #00d084;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      p {
        color: #8b949e;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="spinner"></div>
    <p id="status">Completing authorization...</p>
  </body>
</html>
