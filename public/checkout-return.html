<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow · Checkout</title>
    <link rel="icon" href="/icon.png" />
    <script src="/checkout-return.js" defer></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #12172a;
        color: #e6edf3;
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
      }
      .icon { font-size: 40px; margin-bottom: 12px; }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { color: #8b949e; font-size: 14px; line-height: 1.6; }
      button {
        margin-top: 20px;
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 9px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" id="icon">⏳</div>
      <h1 id="title">Finishing up…</h1>
      <p id="message">One moment.</p>
      <button id="close" type="button" hidden>Close this tab</button>
    </div>
  </body>
</html>
