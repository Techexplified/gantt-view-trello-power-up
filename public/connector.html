<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow – Connector</title>
    <!-- The Trello Power-Up SDK MUST be loaded here because Trello loads
       this file as a standalone iframe, not through your React app. -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <script>
      // ── Icon ────────────────────────────────────────────────────────────────────
      // Must be a publicly accessible PNG/SVG, at least 24x24px.
      // We use an inline SVG data-URI so there are zero external-icon load issues.
      var ICON =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <rect x="0" y="2" width="12" height="4" rx="1" fill="#00d084"/>
            <rect x="4" y="7" width="12" height="4" rx="1" fill="#00d084"/>
            <rect x="2" y="12" width="14" height="4" rx="1" fill="#00d084"/>
          </svg>
        `);

      var ICON_DARK =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
              <rect x="1" y="2" width="14" height="12" rx="1.5" fill="#00d084"/>
              <rect x="2.5" y="4" width="6" height="2.5" rx="1" fill="#ffffff"/>
              <rect x="5" y="7" width="8" height="2.5" rx="1" fill="#ffffff"/>
              <rect x="3" y="10" width="10" height="2.5" rx="1" fill="#ffffff"/>
            </svg>
            `);

      // ── The base URL of your deployed app ───────────────────────────────────────
      var BASE_URL = window.location.origin;

      // ── Initialize ──────────────────────────────────────────────────────────────
      TrelloPowerUp.initialize(
        {
          // 1. Board button — appears in Trello's top navbar
          "board-buttons": function (t) {
            return [
              {
                icon: {
                  dark: ICON_DARK, // shown on dark Trello backgrounds
                  light: ICON, // shown on light Trello backgrounds
                },
                text: "TaskFlow",
                condition: "always",
                callback: function (t) {
                  return t.modal({
                    title: "TaskFlow",
                    url: BASE_URL + "/index.html",
                    fullscreen: true,
                    accentColor: "#00d084",
                  });
                },
              },
            ];
          },

          // 2. Settings popup (gear icon in the Power-Up list)
          "show-settings": function (t) {
            return t.popup({
              title: "TaskFlow Settings",
              url: BASE_URL + "/index.html?settings=1",
              height: 120,
            });
          },
        },
        {
          appKey: "e45a7c2350efb8ff28812397ba677b0c", // <-- replace with your real API key
          appName: "TaskFlow",
        },
      );
    </script>
  </body>
</html>
